services:
  dxradar:
    build:
      context: .
      # Pass the real git hash to the build so the About page shows it:
      #   GIT_HASH=$(git rev-parse --short HEAD) docker compose build
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
        # Optional model overrides baked into the frontend (empty = app default)
        VITE_GEMINI_MODEL: ${VITE_GEMINI_MODEL:-}
        VITE_DEEPSEEK_MODEL: ${VITE_DEEPSEEK_MODEL:-}
    image: dxradar
    # Always build locally; never try to pull "dxradar" from Docker Hub
    pull_policy: build
    ports:
      # Localhost only; the reverse proxy on the host publishes it
      - "127.0.0.1:3000:3000"
    volumes:
      # ClubLog request log (logs/clublog.log) survives container rebuilds
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # QO-100 skimmer: by default on the shared "radio" network; a skimmer on another
      # host is set in .env, e.g. QO100_SKIMMER_URL=https://qo100.ok1cdj.com (token in .env)
      QO100_SKIMMER_URL: ${QO100_SKIMMER_URL:-http://qo100-ft-skimmer-skimmer-1:8080}
    networks:
      - default
      - radio
    restart: unless-stopped

networks:
  # Shared with QO100-FT-skimmer; create once on the host: docker network create radio
  radio:
    external: true
