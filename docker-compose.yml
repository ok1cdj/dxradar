services:
  dxradar:
    build:
      context: .
      # Pass the real git hash to the build so the About page shows it:
      #   GIT_HASH=$(git rev-parse --short HEAD) docker compose build
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
    image: dxradar
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # QO-100 FT8/FT4 skimmer on the shared "radio" network (token in .env)
      QO100_SKIMMER_URL: http://qo100-skimmer:8080
    networks:
      - default
      - radio
    restart: unless-stopped

networks:
  # Shared with QO100-FT-skimmer; create once on the host: docker network create radio
  radio:
    external: true
